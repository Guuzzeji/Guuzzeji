<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      /* palette flips magenta / black every 4s, like a strobe */
      .bg  { animation: bg 8s infinite steps(1); }
      .fg  { animation: fg 8s infinite steps(1); }
      .fgs { fill: none; stroke-width: 1.5; animation: fgs 8s infinite steps(1); }
      @keyframes bg  { 0% { fill: #ff2bd6; } 50% { fill: #0b0b0b; } }
      @keyframes fg  { 0% { fill: #0b0b0b; } 50% { fill: #ff2bd6; } }
      @keyframes fgs { 0% { stroke: #0b0b0b; } 50% { stroke: #ff2bd6; } }

      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .big  { font-weight: 900; font-size: 84px; letter-spacing: -4px; }
      .lbl  { font-weight: 700; font-size: 9px; letter-spacing: 0.4px; }
      .lblx { font-weight: 700; font-size: 11px; letter-spacing: 0.4px; }

      .bob { animation: bob 2s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(8px) rotate(2deg); } }
      .shades { animation: dealwithit 8s infinite; }
      @keyframes dealwithit {
        0%   { transform: translateY(-140px); }
        12%, 100% { transform: translateY(0); }
      }
      .tw  { animation: tw 1.6s infinite; }
      .tw2 { animation: tw 1.6s infinite 0.8s; }
      @keyframes tw { 50% { opacity: 0.1; } }
      .pct { opacity: 0; animation: pct 4s infinite steps(1); }
      .p1 { animation-delay: 0s; } .p2 { animation-delay: -3s; }
      .p3 { animation-delay: -2s; } .p4 { animation-delay: -1s; }
      @keyframes pct { 0% { opacity: 1; } 25% { opacity: 0; } }
      .k1 { animation: knob 3s ease-in-out infinite alternate; }
      .k2 { animation: knob 2.2s ease-in-out infinite alternate-reverse; }
      .k3 { animation: knob 4s ease-in-out infinite alternate; }
      @keyframes knob { to { transform: translateX(70px); } }
      .blink { animation: blink 1s infinite steps(1); }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <path id="star" d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2Z"/>
  </defs>

  <rect width="1200" height="400" class="bg"/>

  <g class="sans">
    <!-- header -->
    <circle cx="38" cy="38" r="9" class="fgs" stroke-width="2"/>
    <path d="M29 38 H47 M38 29 V47 M32 32 Q38 38 32 44 M44 32 Q38 38 44 44" class="fgs"/>
    <text x="54" y="44" font-size="19" font-weight="800" letter-spacing="-0.6" class="fg">Guuzzeji</text>
    <text x="55" y="56" class="lbl fg" opacity="0.7">SAY IT: "GOOSE-ZA-JEE"</text>
    <text x="440" y="34" class="lbl fg">GZJ-001</text>
    <text x="440" y="46" class="lbl fg">SELF-TAUGHT SPECIMEN</text>
    <text x="1176" y="34" text-anchor="end" class="lbl fg">WEIRD THINGS STUDY</text>
    <text x="1176" y="46" text-anchor="end" class="lbl fg">LEVEL 0 / 2026</text>
    <rect x="24" y="62" width="1152" height="1.5" class="fg"/>

    <!-- spec row -->
    <text x="24" y="80" class="lbl fg" opacity="0.6">SUBJECT</text>
    <text x="24" y="93" class="lbl fg">GABE / GUUZZEJI</text>
    <rect x="430" y="64" width="1.5" height="36" class="fg"/>
    <text x="440" y="80" class="lbl fg" opacity="0.6">LOCATION</text>
    <text x="440" y="93" class="lbl fg">THE MATRIX / BACKR00M.XYZ</text>
    <rect x="700" y="64" width="1.5" height="36" class="fg"/>
    <text x="710" y="80" class="lbl fg" opacity="0.6">INSTRUCTION</text>
    <text x="710" y="93" class="lbl fg">BUILD · BREAK · SHIP THE MEME</text>
    <rect x="24" y="100" width="1152" height="1.5" class="fg"/>

    <!-- left panel -->
    <rect x="24" y="114" width="118" height="20" rx="10" class="fgs"/>
    <text x="83" y="127" text-anchor="middle" class="lbl fg">STATUS: ON</text>
    <text x="160" y="122" class="lbl fg">Walk through the wall, trigger the build,</text>
    <text x="160" y="134" class="lbl fg">and pray it works on the first try.</text>

    <rect x="460" y="112" width="210" height="50" class="fg"/>
    <g class="bg" font-size="34" font-weight="400" letter-spacing="-1">
      <text x="470" y="150" class="pct p1">80%</text>
      <text x="470" y="150" class="pct p2">87%</text>
      <text x="470" y="150" class="pct p3">94%</text>
      <text x="470" y="150" class="pct p4">99%</text>
    </g>
    <text x="662" y="134" text-anchor="end" class="lbl bg">WEIRD</text>
    <text x="662" y="145" text-anchor="end" class="lbl bg">ENERGY</text>
    <rect x="470" y="154" width="190" height="1" class="bg"/>

    <text x="18" y="206" class="big fg">CLAUDE</text>
    <text x="18" y="272" class="big fg">MODE</text>
    <text x="18" y="338" class="big fg">ACTIVE<tspan class="blink">_</tspan></text>

    <rect x="700" y="100" width="1.5" height="248" class="fg"/>

    <!-- right panel: the specimen -->
    <text x="712" y="118" class="lbl fg">OBJECT / CRT-01</text>
    <text x="1176" y="322" text-anchor="end" class="lbl fg">CAFFEINE-LINKED</text>
    <text x="1176" y="334" text-anchor="end" class="lbl fg">BUILD RESPONSE</text>

    <g class="fg"><use href="#star" x="790" y="150" class="tw"/></g>
    <g class="fg"><use href="#star" x="1110" y="140" class="tw2"/></g>
    <g class="fg"><use href="#star" x="1130" y="262" class="tw"/></g>
    <g class="fg"><use href="#star" x="830" y="300" class="tw2"/></g>
    <g class="fg"><circle cx="1080" cy="300" r="2" class="tw"/></g>
    <g class="fg"><circle cx="760" cy="230" r="2" class="tw2"/></g>

    <!-- hanging CRT, disco-ball style -->
    <g class="bob" style="transform-origin: 950px 101px">
      <rect x="948" y="101" width="3" height="34" class="fg"/>
      <rect x="935" y="128" width="30" height="12" rx="3" class="fg"/>
      <rect x="868" y="138" width="164" height="128" rx="12" class="fg"/>
      <rect x="884" y="152" width="132" height="94" rx="6" class="bg"/>
      <!-- checker screen -->
      <g class="fg">
        <rect x="884" y="152" width="33" height="23"/><rect x="950" y="152" width="33" height="23"/>
        <rect x="917" y="175" width="33" height="24"/><rect x="983" y="175" width="33" height="24"/>
        <rect x="884" y="199" width="33" height="24"/><rect x="950" y="199" width="33" height="24"/>
        <rect x="917" y="223" width="33" height="23"/><rect x="983" y="223" width="33" height="23"/>
      </g>
      <rect x="884" y="152" width="132" height="94" rx="6" class="fgs" stroke-width="2"/>
      <circle cx="1012" cy="257" r="3" class="bg"/>
      <path d="M915 266 L985 266 L995 284 L905 284Z" class="fg"/>

      <!-- deal-with-it pixel shades -->
      <g class="shades">
        <g fill="#0b0b0b" stroke="#fff" stroke-width="3" stroke-linejoin="miter">
          <path d="M856 186 H1044 V196 H1032 V206 H1022 V214 H982 V206 H972 V196 H930 V206 H920 V214 H880 V206 H870 V196 H856Z"/>
        </g>
        <g fill="#fff">
          <rect x="888" y="194" width="8" height="5"/><rect x="896" y="199" width="8" height="5"/>
          <rect x="990" y="194" width="8" height="5"/><rect x="998" y="199" width="8" height="5"/>
        </g>
      </g>
    </g>

    <!-- floating XP-ish error dialog -->
    <g transform="translate(730 252) rotate(-4)">
      <rect width="196" height="72" rx="4" class="bg"/>
      <rect width="196" height="72" rx="4" class="fgs" stroke-width="2"/>
      <rect width="196" height="18" rx="4" class="fg"/>
      <text x="8" y="13" class="lbl bg">Error</text>
      <rect x="178" y="3" width="13" height="12" rx="2" class="bg"/>
      <text x="184.5" y="13" text-anchor="middle" class="lbl fg">x</text>
      <circle cx="20" cy="38" r="9" class="fg"/>
      <text x="20" y="42" text-anchor="middle" font-size="12" font-weight="900" class="bg">!</text>
      <text x="38" y="36" class="lblx fg">Task failed</text>
      <text x="38" y="49" class="lblx fg">successfully.</text>
      <rect x="138" y="48" width="48" height="16" rx="2" class="fgs"/>
      <text x="162" y="60" text-anchor="middle" class="lbl fg">OK</text>
      <path d="M170 56 V72 L174 68 L177 75 L180 74 L177 67 L183 67Z" fill="#fff" stroke="#0b0b0b" stroke-width="1.2"/>
    </g>

    <!-- footer -->
    <rect x="24" y="348" width="1152" height="1.5" class="fg"/>
    <text x="24" y="368" class="lbl fg">GUUZZEJI INTERFACE © 2026</text>
    <text x="24" y="380" class="lbl fg">ONE DEV / ENDLESS SIDE PROJECTS</text>

    <text x="320" y="374" class="lbl fg">CHAOS</text>
    <rect x="362" y="370" width="90" height="1" class="fg"/>
    <g class="fg"><circle cx="372" cy="370.5" r="4" class="k1"/></g>
    <text x="520" y="374" class="lbl fg">COFFEE</text>
    <rect x="566" y="370" width="90" height="1" class="fg"/>
    <g class="fg"><circle cx="576" cy="370.5" r="4" class="k2"/></g>
    <text x="724" y="374" class="lbl fg">SNEAK KING</text>
    <rect x="790" y="370" width="90" height="1" class="fg"/>
    <g class="fg"><circle cx="800" cy="370.5" r="4" class="k3"/></g>

    <rect x="1036" y="361" width="140" height="20" rx="10" class="fgs"/>
    <text x="1106" y="374" text-anchor="middle" class="lbl fg">ENTER THE BACKR00M</text>
  </g>
</svg>
